name: Web'i GitHub Pages'a yayınla

on:
  push:
    branches: [claude/construction-worker-tracking-app-pknd8l, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Web derlemesi
        run: npx expo export --platform web --output-dir dist
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      # GitHub Pages yönlendirme desteklemez; /workers gibi adresler doğrudan açılınca uygulama yüklensin
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
